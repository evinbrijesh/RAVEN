[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raven-guard"
version = "1.0.0"
description = "Deterministic, fail-closed runtime policy gateway and security guardrails for LLM tool calling"
readme = "README.md"
license = "MIT"
authors = [
    { name = "RAVEN Security Team", email = "security@project-raven.dev" }
]
maintainers = [
    { name = "RAVEN Open Source Contributors" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]
keywords = [
    "llm-security",
    "ai-agent",
    "guardrails",
    "prompt-injection",
    "policy-gateway",
    "langchain",
    "langgraph",
    "fastapi",
    "opentelemetry",
    "owasp-llm-top-10",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/evinbrijesh/RAVEN"
Documentation = "https://github.com/evinbrijesh/RAVEN/blob/main/packages/raven-guard/README.md"
Repository = "https://github.com/evinbrijesh/RAVEN.git"
Issues = "https://github.com/evinbrijesh/RAVEN/issues"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]
langchain = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]
opentelemetry = [
    "opentelemetry-api>=1.20.0",
]
all = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "opentelemetry-api>=1.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["raven_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
