# RAVEN optional reverse proxy (hackathon demo profile).
# Mounted at /etc/nginx/conf.d/default.conf (http context) by docker-compose.
# Start with:  docker compose --profile proxy up nginx   →  http://localhost:8080
#
# SSE contract: the control plane streams scan progress at
# /api/scans/{scan_id}/events (text/event-stream). Proxy buffering MUST stay
# off for that route or live progress arrives in delayed bursts. The app also
# sends `X-Accel-Buffering: no`, honored by nginx — the config below makes the
# guarantee explicit and independent of app headers.

upstream raven_web {
    server web:3000;
}

upstream raven_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Request-size limit (blueprint §9: proxy-level limits).
    client_max_body_size 1m;

    # General API traffic. Buffering off here too — cheap for JSON and keeps
    # behavior uniform if new stream endpoints appear.
    location /api/ {
        proxy_pass http://raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # SSE event stream: long-lived, never buffered, generous read timeout so
    # idle polling intervals are not mistaken for a dead upstream.
    location ~ ^/api/scans/[^/]+/events$ {
        proxy_pass http://raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # FastAPI docs and health endpoints (handy for judges).
    location ~ ^/(docs|openapi\.json|health|ready)$ {
        proxy_pass http://raven_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js.
    location / {
        proxy_pass http://raven_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
