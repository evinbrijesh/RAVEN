[project]
name = "raven-test"
version = "1.0.0"
description = "Autonomous Security Regression & Remediation Assurance CLI for LLM Applications and Agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "RAVEN Security Team", email = "security@raven-ai.dev" }]
requires-python = ">=3.12"
keywords = ["security", "llm", "ai-safety", "red-teaming", "devops", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "raven-api",
    "pyyaml>=6.0",
]

[project.scripts]
raven-test = "evaluator.cli:main"

[tool.uv.sources]
raven-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py312"
