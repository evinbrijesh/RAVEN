[project]
name = "raven-evaluator"
version = "0.1.0"
description = "RAVEN evaluation worker: state machine, targets, judges, hardening, regression"
dependencies = [
    "raven-api",
    "pyyaml>=6.0",
]

[project.scripts]
raven-test = "evaluator.cli:main"

[tool.uv.sources]
raven-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py312"
