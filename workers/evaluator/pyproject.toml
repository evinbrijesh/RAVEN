[project]
name = "raven-evaluator"
version = "0.1.0"
description = "RAVEN evaluation worker: state machine, targets, judges, hardening, regression"
requires-python = ">=3.12"
dependencies = ["raven-api"]

[tool.uv.sources]
raven-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
