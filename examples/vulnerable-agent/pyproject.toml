[project]
name = "vulnerable-agent-demo"
version = "0.1.0"
description = "Demo vulnerable customer assistant agent for testing RAVEN security regression scanning"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
